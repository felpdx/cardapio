<style>
:root{
  --ink:#6b0f18;          /* Smokey Ember */
  --muted:#8a4b44;
  --bg:#fde9cf;           /* Crispy Creamy */
  --card:#fff8ee;
  --line:#f0cfa6;
  --red:#e31e2d;          /* Roasted Red */
  --accent:#ffb81c;       /* Spicy Sunrise */
  --accent-ink:#6b0f18;
  --orange:#f58220;       /* Burnt Heat */
  --ok:#1f9d57;
  --err:#c8352b;
  --radius:16px;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --logo:"Chango","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:110px;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

header{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 56px}
.wrap{max-width:720px;margin:0 auto}
.head{display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
header h1{font-family:var(--logo);font-weight:400;font-size:clamp(3.2rem,14vw,4.6rem);line-height:1;letter-spacing:.01em;color:#fff3dc;text-shadow:2px 2px 0 var(--ink),4px 4px 0 var(--ink)}
.tag{display:block;margin-top:12px;font-family:var(--head);font-weight:800;font-size:1.05rem;color:#fff}
.mascote{flex:none;width:clamp(104px,30vw,150px);height:auto;margin-bottom:-18px;transform:rotate(4deg)}
header p{margin-top:6px;color:#fff;max-width:36ch}

/* barra de categorias: vidro fosco, fixa no topo ao rolar */
nav{position:sticky;top:0;z-index:5;margin-top:-30px;border-radius:24px 24px 0 0;padding:14px 0 10px;
  background:rgba(253,233,207,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 -1px 0 var(--line)}
.chips{display:flex;gap:12px;overflow-x:auto;padding:2px 20px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.cat{flex:none;width:84px;scroll-snap-align:start;border-radius:22px;padding:12px 6px 9px;text-align:center;cursor:pointer;
  background:rgba(107,15,24,.42);border:1px solid rgba(255,255,255,.4);color:#fff3dc;text-shadow:0 1px 2px rgba(75,23,21,.55);
  -webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);
  box-shadow:0 4px 14px rgba(107,15,24,.14),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .2s,background .2s}
.cat svg{width:38px;height:38px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cat span{display:block;margin-top:5px;font-size:.78rem;font-weight:700}
.cat[aria-current="true"]{background:rgba(227,30,45,.78);transform:translateY(-2px)}
.cat:active{transform:scale(.96)}

/* fundo: cor sólida + ícones em diagonal bem apagados e levemente desfocados */
.fundo{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.fundo svg{position:absolute;left:-30%;top:-30%;width:160%;height:160%;transform:rotate(-18deg);opacity:.28;filter:blur(1.5px)}

/* vidro fosco; sem suporte a backdrop-filter, sobe a opacidade para manter o texto legível */
.vidro{background:rgba(255,248,238,.5);border:1px solid rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 8px 24px rgba(107,15,24,.12),inset 0 1px 0 rgba(255,255,255,.7)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.vidro{background:rgba(255,248,238,.92)}}

main{padding:6px 20px}
section{margin-top:22px}
section h2{font-family:var(--head);font-size:1.35rem;font-weight:800;margin-bottom:4px;display:flex;align-items:baseline;gap:10px}
section h2::after{content:"";flex:1;height:2px;background:var(--ink);opacity:.15;border-radius:2px}
/* itens: cada categoria é um carrossel horizontal de cards com foto */
.itens{display:flex;gap:14px;overflow-x:auto;margin:8px -20px 0;padding:6px 20px 18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.itens::-webkit-scrollbar{display:none}
.item{flex:none;width:210px;scroll-snap-align:start;border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.foto{position:relative;aspect-ratio:4/3;background:rgba(227,30,45,.08)}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.foto .sem{position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem}
.info{min-width:0;padding:12px 14px 8px;flex:1}
.info b{display:block;font-family:var(--head);font-weight:800;font-size:1.05rem;line-height:1.2}
.info small{display:block;color:var(--muted);font-size:.87rem;margin-top:3px;min-height:2.6em}
.price{font-weight:800;margin-top:6px;color:var(--red);font-variant-numeric:tabular-nums}
.item [data-ctrl]{padding:0 14px 14px}
.item .add{width:100%}
.item .qty{justify-content:space-between}
.add{flex:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:12px;padding:10px 16px;cursor:pointer}
.add:active{transform:scale(.96)}
.qty{flex:none;display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:12px;padding:3px}
.qty button{width:34px;height:34px;border:0;border-radius:9px;background:var(--card);font-size:1.15rem;font-weight:800;cursor:pointer}
.qty span{min-width:26px;text-align:center;font-weight:700}

/* barra do carrinho */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:688px;margin:0 auto;border:0;background:var(--red);color:#fff;border-radius:16px;padding:16px 20px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(227,30,45,.35)}
.bar[hidden]{display:none}

/* folha do pedido */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(107,15,24,.6);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font-family:var(--head);font-size:1.5rem;font-weight:800}
.close{border:0;background:var(--card);width:38px;height:38px;border-radius:50%;font-size:1.2rem;cursor:pointer}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1;min-width:0}
.line .n small{display:block;color:var(--muted)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;padding:14px 0}
label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 5px}
input,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px}
input[aria-invalid="true"]{border-color:var(--err)}
textarea{resize:vertical;min-height:70px}
.hint{color:var(--muted);font-size:.82rem;margin-top:4px}
.error{color:var(--err);font-size:.88rem;margin-top:10px;font-weight:500}
.send{width:100%;margin-top:18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.05rem;border-radius:14px;padding:16px;cursor:pointer}
.send{position:relative;overflow:hidden;isolation:isolate}
/* barra de carregamento: preenche o botão enquanto o pedido é enviado.
   Não há progresso real do fetch, então ela sobe até ~90% e só completa quando o servidor responde. */
.send::before{content:"";position:absolute;inset:0;z-index:-1;width:0;background:var(--orange)}
.send.carregando::before{animation:encher 6s cubic-bezier(.2,.7,.3,1) forwards}
.send.concluido::before{animation:none;width:100%;transition:width .25s ease-out}
@keyframes encher{from{width:0}to{width:90%}}
.send:disabled{cursor:wait}
.empty{color:var(--muted);padding:18px 0}

/* esgotado */
.item.esgotado .foto img,.item.esgotado .foto .sem{filter:grayscale(1);opacity:.5}
.item.esgotado .info b{color:var(--muted)}
.tag-esgotado{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:800;color:var(--err);text-transform:uppercase;letter-spacing:.04em}
.add:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;transform:none}

/* pagamento */
.pgto{display:grid;gap:8px;margin-top:6px}
.pgto label{margin:0;display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;font-size:.95rem;cursor:pointer}
.pgto input{width:auto;margin:0}
.pix{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.pix b{display:block;word-break:break-all;margin:4px 0 10px;font-size:1.05rem}
.pix .row{display:flex;gap:8px;flex-wrap:wrap}
.pix button,.pix a{flex:1;text-align:center;border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;text-decoration:none;background:var(--accent);color:var(--accent-ink)}
.pix a{background:#25d366;color:#fff}
.codigo-grande{font-size:2.4rem;font-weight:900;letter-spacing:.06em;margin:4px 0 10px}

/* confirmação */
.done{text-align:center;padding:24px 8px 8px}
.done .ok{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:2.2rem;animation:pop .35s ease-out}
.done h2{margin-bottom:8px}
.done p{color:var(--muted);max-width:36ch;margin:0 auto 6px}
.done .code{display:inline-block;margin:10px 0 18px;background:var(--card);border:2px dashed var(--orange);border-radius:12px;padding:8px 16px;font-weight:800;letter-spacing:.04em}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
/* ============================================================
   CONFIGURAÇÃO (URLs do n8n, Pix, WhatsApp) fica em config.js
   ============================================================ */
const CFG = window.CONFIG || {};

// Cardápio de reserva. O cardápio oficial é a aba "Cardapio" da planilha (preço e esgotado são
// editados pelo painel): quando ela carrega, substitui este MENU. Este só aparece se a planilha
// estiver fora do ar, e por isso precisa manter os mesmos "id".
// "id" precisa ser único. "emoji" aparece enquanto a foto não existe.
// "foto" é o caminho da imagem (pasta fotos/, relativa a este arquivo). Deixe "" se não tiver.
let MENU = [
  { categoria: "Salgados", itens: [
    { id: "coxinha",  nome: "Coxinha de frango",   desc: "Massa macia, recheio cremoso", preco: 6.00,  emoji: "🍗", foto: "fotos/coxinha.jpg" },
    { id: "pao-queijo", nome: "Pão de queijo",      desc: "Quentinho, saindo do forno",   preco: 4.50,  emoji: "🧀", foto: "fotos/pao-queijo.jpg" },
    { id: "pastel",   nome: "Pastel de carne",      desc: "Crocante, tamanho grande",     preco: 7.50,  emoji: "🥟", foto: "fotos/pastel.jpg" },
    { id: "misto",    nome: "Misto quente",         desc: "Presunto e queijo",            preco: 8.00,  emoji: "🥪", foto: "fotos/misto.jpg" }
  ]},
  { categoria: "Lanches", itens: [
    { id: "x-burger", nome: "X-Burger",             desc: "Hambúrguer, queijo e salada",  preco: 15.00, emoji: "🍔", foto: "fotos/x-burger.jpg" },
    { id: "x-bacon",  nome: "X-Bacon",              desc: "Hambúrguer, queijo e bacon",   preco: 18.00, emoji: "🥓", foto: "fotos/x-bacon.jpg" },
    { id: "natural",  nome: "Sanduíche natural",    desc: "Frango, cenoura e alface",     preco: 10.00, emoji: "🥬", foto: "fotos/natural.jpg" }
  ]},
  { categoria: "Bebidas", itens: [
    { id: "refri",    nome: "Refrigerante lata",    desc: "350 ml",                       preco: 5.00,  emoji: "🥤", foto: "fotos/refri.jpg" },
    { id: "suco",     nome: "Suco natural",         desc: "Laranja ou maracujá, 400 ml",  preco: 7.00,  emoji: "🍊", foto: "fotos/suco.jpg" },
    { id: "agua",     nome: "Água mineral",         desc: "500 ml",                       preco: 3.00,  emoji: "💧", foto: "fotos/agua.jpg" },
    { id: "cafe",     nome: "Café",                 desc: "Coado na hora",                preco: 3.50,  emoji: "☕", foto: "fotos/cafe.jpg" }
  ]},
  { categoria: "Doces", itens: [
    { id: "brigadeiro", nome: "Brigadeiro",         desc: "Tradicional",                  preco: 3.00,  emoji: "🍫", foto: "fotos/brigadeiro.jpg" },
    { id: "bolo",     nome: "Fatia de bolo",        desc: "Sabor do dia",                 preco: 6.00,  emoji: "🍰", foto: "fotos/bolo.jpg" }
  ]}
];

/* ============================================================
   CÓDIGO
   ============================================================ */
const $ = (s) => document.querySelector(s);
const brl = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
let ALL = MENU.flatMap(c => c.itens);
// Ícone de cada categoria na barra. Só visual: o MENU não muda. Categoria nova sem ícone usa o de lanche.
const ICONES = { Salgados: "i-salgado", Lanches: "i-lanche", Pizzas: "i-pizza", "Porções": "i-batata", Bebidas: "i-bebida", Doces: "i-doce" };
const iconeDe = (cat) => `<svg aria-hidden="true"><use href="#${ICONES[cat] || "i-lanche"}"/></svg>`;
const cart = {};          // { id: quantidade }
let sending = false;
let pedidoPendente = null; // pedido não confirmado: reenvio usa o mesmo pedido_id (evita duplicata)

/* ---- cardápio ---- */
function renderMenu() {
  $("#chips").innerHTML = MENU.map((c, i) =>
    `<button class="cat" data-cat="cat-${i}" ${i === 0 ? 'aria-current="true"' : ""}>${iconeDe(c.categoria)}<span>${c.categoria}</span></button>`
  ).join("");

  $("#menu").innerHTML = MENU.map((c, i) => `
    <section id="cat-${i}">
      <h2>${c.categoria}</h2>
      <div class="itens">
      ${c.itens.map(it => `
        <article class="item vidro ${it.disponivel === false ? "esgotado" : ""}">
          <div class="foto">
            <span class="sem" aria-hidden="true">${it.emoji}</span>
            ${it.foto ? `<img src="${it.foto}" alt="${it.nome}" loading="lazy" onerror="this.remove()">` : ""}
          </div>
          <div class="info">
            <b>${it.nome}</b><small>${it.desc}</small>
            <div class="price">${brl(it.preco)}</div>
            ${it.disponivel === false ? '<span class="tag-esgotado">Esgotado</span>' : ""}
          </div>
          <div data-ctrl="${it.id}"></div>
        </article>`).join("")}
      </div>
    </section>`).join("");

  ALL.forEach(it => renderCtrl(it.id));
}

function renderCtrl(id) {
  const q = cart[id] || 0;
  const el = document.querySelector(`[data-ctrl="${id}"]`);
  if (!el) return;
  el.innerHTML = q
    ? `<div class="qty"><button data-dec="${id}" aria-label="Tirar um">−</button><span>${q}</span><button data-inc="${id}" aria-label="Adicionar mais um">+</button></div>`
    : indisponivel(id)
      ? `<button class="add" disabled>Esgotado</button>`
      : `<button class="add" data-inc="${id}">Adicionar</button>`;
}

function indisponivel(id) {
  return ALL.find(x => x.id === id)?.disponivel === false;
}

function change(id, delta) {
  if (delta > 0 && indisponivel(id)) return;
  pedidoPendente = null;   // carrinho mudou: o próximo envio é um pedido novo
  const q = Math.max(0, (cart[id] || 0) + delta);
  if (q) cart[id] = q; else delete cart[id];
  renderCtrl(id);
  updateBar();
  if ($("#overlay").classList.contains("open") && !$("#sheet").querySelector(".done")) renderSheet($("#nome") ? snapshotForm() : {});
}

function totals() {
  let count = 0, total = 0;
  for (const id in cart) {
    const it = ALL.find(x => x.id === id);
    count += cart[id]; total += cart[id] * it.preco;
  }
  return { count, total };
}

function updateBar() {
  const { count, total } = totals();
  $("#bar").hidden = count === 0;
  $("#barCount").textContent = `Ver pedido (${count} ${count === 1 ? "item" : "itens"})`;
  $("#barTotal").textContent = brl(total);
}

/* ---- navegação por categoria ---- */
document.addEventListener("click", (e) => {
  const chip = e.target.closest(".cat");
  if (chip) {
    document.getElementById(chip.dataset.cat).scrollIntoView();
    return;
  }
  const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]");
  if (inc) change(inc.dataset.inc, 1);
  if (dec) change(dec.dataset.dec, -1);
});

const sections = () => [...document.querySelectorAll("main section")];
let activeIdx = 0;
function setActive(i) {
  const chips = [...document.querySelectorAll(".cat")];
  chips.forEach((c, k) => c.setAttribute("aria-current", k === i ? "true" : "false"));
  // rola só a barra de categorias (na horizontal), nunca a página
  const box = $("#chips"), c = chips[i];
  box.scrollTo({ left: c.offsetLeft - (box.clientWidth - c.offsetWidth) / 2, behavior: "smooth" });
}
window.addEventListener("scroll", () => {
  let current = 0;
  sections().forEach((s, i) => { if (s.getBoundingClientRect().top < 160) current = i; });
  if (current !== activeIdx) { activeIdx = current; setActive(current); }
}, { passive: true });

/* ---- folha do pedido ---- */
function openSheet() { renderSheet(); $("#overlay").classList.add("open"); }
function closeSheet() { $("#overlay").classList.remove("open"); }
$("#openCart").addEventListener("click", openSheet);
$("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

function renderSheet(keep = {}) {
  const { count, total } = totals();
  if (!count) {
    $("#sheet").innerHTML = `
      <div class="sheet-head"><h2 id="sheetTitle">Seu pedido</h2><button class="close" data-close aria-label="Fechar">✕</button></div>
      <p class="empty">Seu pedido está vazio. Escolha algo no cardápio.</p>`;
    return;
  }
  const lines = Object.keys(cart).map(id => {
    const it = ALL.find(x => x.id === id);
    return `<div class="line">
      <div class="n"><b>${it.nome}</b><small>${brl(it.preco)} cada</small></div>
      <div class="qty"><button data-dec="${id}" aria-label="Tirar um">−</button><span>${cart[id]}</span><button data-inc="${id}" aria-label="Adicionar mais um">+</button></div>
      <b>${brl(it.preco * cart[id])}</b>
    </div>`;
  }).join("");

  $("#sheet").innerHTML = `
    <div class="sheet-head"><h2 id="sheetTitle">Seu pedido</h2><button class="close" data-close aria-label="Fechar">✕</button></div>
    ${lines}
    <div class="total"><span>Total</span><span>${brl(total)}</span></div>

    <label for="nome">Seu nome</label>
    <input id="nome" autocomplete="name" value="${keep.nome || ""}">

    <label for="zap">Seu WhatsApp</label>
    <input id="zap" inputmode="tel" autocomplete="tel" placeholder="(99) 99999-9999" value="${keep.zap || ""}">
    <div class="hint">Vamos avisar por aqui quando o pedido for aceito.</div>

    ${CFG.PIX_CHAVE ? `
    <label>Pagamento</label>
    <div class="pgto">
      <label><input type="radio" name="forma" value="balcao" ${keep.forma !== "pix" ? "checked" : ""}> Pagar na retirada</label>
      <label><input type="radio" name="forma" value="pix" ${keep.forma === "pix" ? "checked" : ""}> Pagar com Pix agora</label>
    </div>` : ""}

    <label for="obs">Observação (opcional)</label>
    <textarea id="obs" placeholder="Ex.: sem cebola, suco de maracujá">${keep.obs || ""}</textarea>

    <div class="error" id="err" role="alert"></div>
    <button class="send" id="send">Enviar pedido</button>`;
}

$("#sheet").addEventListener("click", (e) => {
  if (e.target.closest("[data-close]")) closeSheet();
  if (e.target.closest("#send")) sendOrder();
  if (e.target.closest("#again")) { closeSheet(); }
  if (e.target.closest("#copiarPix")) copiarPix();
});

/* ---- envio ---- */
function snapshotForm() {
  return {
    nome: $("#nome")?.value || "",
    zap: $("#zap")?.value || "",
    obs: $("#obs")?.value || "",
    forma: document.querySelector('input[name="forma"]:checked')?.value || "balcao"
  };
}
function normalizePhone(raw) {
  let d = raw.replace(/\D/g, "");
  if (d.length === 10 || d.length === 11) d = "55" + d;    // adiciona o código do Brasil
  return d;
}

function showError(msg, field) {
  $("#err").textContent = msg;
  ["nome", "zap"].forEach(f => $("#" + f).setAttribute("aria-invalid", f === field ? "true" : "false"));
  if (field) $("#" + field).focus();
}

async function sendOrder() {
  if (sending) return;
  const f = snapshotForm();
  const nome = f.nome.trim();
  const phone = normalizePhone(f.zap);

  if (nome.length < 2) return showError("Informe seu nome.", "nome");
  if (phone.length < 12 || phone.length > 13) return showError("Informe um WhatsApp válido, com DDD.", "zap");
  showError("", null);

  // Só id e quantidade vão ao servidor: o preço é recalculado no n8n a partir do cardápio oficial.
  // Nova tentativa reaproveita o mesmo pedido_id, para o servidor reconhecer e não duplicar.
  if (!pedidoPendente) {
    pedidoPendente = {
      pedido_id: novoId(),
      criado_em: new Date().toISOString(),
      cliente: { nome, whatsapp: phone },
      itens: Object.keys(cart).map(id => ({ id, quantidade: cart[id] })),
      observacao: f.obs.trim(),
      pagamento: { forma: f.forma === "pix" ? "pix" : "balcao", situacao: "pendente" },
      status: "recebido"
    };
  }
  const pedido = pedidoPendente;

  sending = true;
  const btn = $("#send");
  btn.disabled = true; btn.textContent = "Enviando..."; btn.classList.add("carregando");

  try {
    let confirmacao;
    if (CFG.N8N_PEDIDO_URL) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 15000);
      const res = await fetch(CFG.N8N_PEDIDO_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(pedido),
        signal: ctrl.signal
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      confirmacao = await res.json();   // esperado: { codigo, total }
    } else {
      // Modo teste (N8N_PEDIDO_URL vazio): nada é enviado, código e total são simulados.
      console.log("Modo teste (N8N_PEDIDO_URL vazio). Pedido que seria enviado:", pedido);
      confirmacao = { codigo: String(Math.floor(1000 + Math.random() * 9000)), total: totals().total };
    }
    if (!confirmacao || !confirmacao.codigo) throw new Error("Resposta sem código de retirada");
    pedidoPendente = null;
    btn.classList.replace("carregando", "concluido");   // completa a barra antes de trocar para a confirmação
    await new Promise(r => setTimeout(r, 350));
    showDone(pedido, confirmacao);
  } catch (err) {
    console.error(err);
    btn.disabled = false; btn.textContent = "Enviar pedido"; btn.classList.remove("carregando");
    $("#err").textContent = "Não conseguimos enviar o pedido. Confira sua conexão e toque em Enviar pedido de novo.";
  } finally {
    sending = false;
  }
}

function novoId() {
  return crypto.randomUUID ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

async function copiarPix() {
  try {
    await navigator.clipboard.writeText(CFG.PIX_CHAVE);
    $("#copiarPix").textContent = "Chave copiada!";
  } catch {
    $("#copiarPix").textContent = "Copie a chave acima";
  }
}

function showDone(p, conf) {
  for (const k in cart) delete cart[k];
  ALL.forEach(it => renderCtrl(it.id));
  updateBar();
  const total = brl(conf.total);
  const pix = p.pagamento.forma === "pix";
  const msgZap = encodeURIComponent(`Olá! Segue o comprovante do pedido #${conf.codigo} (${total}).`);
  $("#sheet").innerHTML = `
    <div class="done">
      <div class="ok" aria-hidden="true">✓</div>
      <h2 id="sheetTitle">Pedido enviado!</h2>
      <p>Código de retirada</p>
      <div class="codigo-grande">#${conf.codigo}</div>
      <p>Total: <b>${total}</b></p>
      <p>Assim que a cantina aceitar, você recebe a confirmação no WhatsApp.</p>
      ${pix ? `
      <div class="pix">
        <span class="hint">Pagamento via Pix: ${total}</span>
        <b>${CFG.PIX_CHAVE}</b>
        ${CFG.PIX_NOME ? `<div class="hint">Favorecido: ${CFG.PIX_NOME}</div>` : ""}
        <div class="row">
          <button id="copiarPix">Copiar chave</button>
          ${CFG.WHATSAPP_CANTINA ? `<a href="https://wa.me/${CFG.WHATSAPP_CANTINA}?text=${msgZap}" target="_blank" rel="noopener">Enviar comprovante</a>` : ""}
        </div>
      </div>` : ""}
      <button class="send" id="again">Fazer outro pedido</button>
    </div>`;
}

/* ---- cardápio oficial vem da planilha (aba "Cardapio") ---- */
// Lê pela API gviz via <script>, como o painel faz: é o jeito que funciona sem CORS.
// Colunas pelo nome do cabeçalho: id | categoria | nome | desc | emoji | preco | disponivel
function lerAbaCardapio(resp) {
  if (!resp || resp.status !== "ok" || !resp.table) return null;
  const col = (n) => resp.table.cols.findIndex(c => String(c.label || "").trim().toLowerCase() === n);
  const ix = { id: col("id"), categoria: col("categoria"), nome: col("nome"), desc: col("desc"),
               emoji: col("emoji"), preco: col("preco"), disp: col("disponivel") };
  // Aba inexistente faz o Google devolver a primeira aba (pedidos): sem o cabeçalho certo, ignora.
  if ([ix.id, ix.categoria, ix.nome, ix.preco].some(i => i < 0)) return null;
  const val = (r, i) => (i >= 0 && r.c && r.c[i]) ? r.c[i].v : null;
  const txt = (r, i) => String(val(r, i) ?? "").trim();
  return (resp.table.rows || []).map(r => {
    const bruto = val(r, ix.preco);
    const preco = typeof bruto === "number" ? bruto : parseFloat(String(bruto ?? "").replace(",", "."));
    const d = val(r, ix.disp);
    const esgotado = d === false || ["false", "nao", "não", "n", "0", "esgotado"].includes(String(d ?? "").trim().toLowerCase());
    return { id: txt(r, ix.id), categoria: txt(r, ix.categoria), nome: txt(r, ix.nome), desc: txt(r, ix.desc),
             emoji: txt(r, ix.emoji) || "🍽️", preco, disponivel: !esgotado };
  }).filter(i => i.id && i.nome && i.categoria && Number.isFinite(i.preco) && i.preco > 0);
}

function aplicarCardapio(lista) {
  const porCategoria = new Map();
  lista.forEach(i => {
    if (!porCategoria.has(i.categoria)) porCategoria.set(i.categoria, []);
    // A foto segue o id: fotos/<id>.jpg. Sem o arquivo, o card mostra o emoji.
    porCategoria.get(i.categoria).push({ id: i.id, nome: i.nome, desc: i.desc, preco: i.preco,
      emoji: i.emoji, foto: `fotos/${i.id}.jpg`, disponivel: i.disponivel });
  });
  const novo = [...porCategoria].map(([categoria, itens]) => ({ categoria, itens }));
  if (JSON.stringify(novo) === JSON.stringify(MENU)) return;   // nada mudou: não redesenha

  MENU = novo;
  ALL = MENU.flatMap(c => c.itens);
  // Item que sumiu ou esgotou não pode continuar no carrinho.
  let removidos = false;
  for (const id in cart) {
    const it = ALL.find(x => x.id === id);
    if (!it || it.disponivel === false) { delete cart[id]; removidos = true; }
  }
  if (removidos) {
    pedidoPendente = null;   // carrinho mudou: o próximo envio é um pedido novo
    alert("Algum item do seu pedido acabou e foi removido do carrinho.");
  }
  renderMenu();
  updateBar();
}

// O Google chama esta função com a resposta (parâmetro responseHandler da URL abaixo).
window.snackCardapio = (resp) => {
  const lista = lerAbaCardapio(resp);
  if (lista && lista.length) aplicarCardapio(lista);   // falha ou aba vazia: segue com o que está na tela
};

function carregarCardapio() {
  if (!CFG.SHEET_ID) return;
  // Com a folha do pedido aberta não troca o cardápio por baixo: os preços mudariam durante o envio.
  if ($("#overlay").classList.contains("open")) return;
  document.getElementById("script-cardapio")?.remove();
  const aba = encodeURIComponent(CFG.ABA_CARDAPIO || "Cardapio");
  const s = document.createElement("script");
  s.id = "script-cardapio";
  s.src = `https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:snackCardapio&headers=1&sheet=${aba}&t=${Date.now()}`;
  document.body.appendChild(s);
}

renderMenu();
updateBar();
carregarCardapio();
setInterval(carregarCardapio, 30000);   // pega preço e "esgotado" alterados no painel sem recarregar a página
</script>
